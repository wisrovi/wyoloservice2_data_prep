[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoloservice-data-prep"
version = "0.3.0"
description = "Dataset validator and Slack notifier for NeuralForgeAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.3.1"
]

[project.scripts]
wyolo-validate = "wyolo_data_prep.validator:main"
